# Builds and deploys the documentation site (docs/) to GitHub Pages.
#
# NOTE: In the repository settings (Settings -> Pages), set the build
# "Source" to "GitHub Actions" — this workflow deploys the artifact itself
# and does not use a gh-pages branch.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
